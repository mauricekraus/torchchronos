name: test and format

on: [push]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run Ruff Format
        run: poetry run ruff format .
      - name: Run Ruff Linter
        run: poetry run ruff .
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run MyPy
        run: poetry run mypy .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run pytest
        run: poetry run pytest