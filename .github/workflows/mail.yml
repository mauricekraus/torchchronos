name: test and format

on: [push]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run pytest
        run: poetry run pytest